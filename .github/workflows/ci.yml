name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: コードを取得する
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js を準備する
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存パッケージを入れる
        run: npm ci

      - name: ESLint でチェックする
        run: npm run lint

      - name: 型をチェックする
        run: npm run typecheck

      - name: Better Auth のテーブルを確かめる
        run: npm run auth:check

      - name: 整形をチェックする
        run: npm run format:check

      - name: テストを実行する
        run: npm test -- --run

      - name: ビルドする
        run: npm run build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      # 本番の URL。Google ログインの戻り先（OAuth クライアント「Mado（本番）」）と同じにする
      APP_URL: https://mado-268372143735.asia-northeast1.run.app
    steps:
      - name: コードを取得する
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Google Cloud にログインする
        uses: google-github-actions/auth@v3
        with:
          project_id: mado-514617
          workload_identity_provider: projects/268372143735/locations/global/workloadIdentityPools/github/providers/mado
          service_account: github-deployer@mado-514617.iam.gserviceaccount.com

      - name: Cloud Run にデプロイする
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: mado
          region: asia-northeast1
          source: .
          flags: --service-account=mado-run@mado-514617.iam.gserviceaccount.com --max-instances=2
          # 本番の設定は、ここに書いたものだけにする（Cloud Run の画面で足した設定は、次のデプロイで消える）
          env_vars_update_strategy: overwrite
          secrets_update_strategy: overwrite
          # 秘密ではない値
          env_vars: |-
            BETTER_AUTH_URL=${{ env.APP_URL }}
            GOOGLE_CLIENT_ID=268372143735-hgekrqtug21ndon0g8s7n7dvml2vvut5.apps.googleusercontent.com
          # 秘密の値は Secret Manager から渡す（読めるのは mado-run だけ）。
          # 起動のときに読まれるので、Google のおすすめどおりバージョンを固定する。
          # 値を変えるときは、Secret Manager に新しいバージョンを足してから、ここの番号を上げる
          secrets: |-
            DATABASE_URL=DATABASE_URL:1
            BETTER_AUTH_SECRET=BETTER_AUTH_SECRET:1
            GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:1
            ENCRYPTION_KEY=ENCRYPTION_KEY:1
            CRON_SECRET=CRON_SECRET:1

      - name: 公開された API を確かめる
        run: curl --fail --silent --show-error "$APP_URL/api/health"
