version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # メジャーバージョンの PR は、CI が赤くても開いたままにして、上がれるようになるのを待つ。
    # そのあいだも、ほかの更新の PR が止まらないように、上限を初期設定の 5 から増やす
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Node.js のメジャーバージョンは、.nvmrc・Dockerfile・@types/node をそろえて手で上げる
      # （新しい LTS が出る毎年10月ごろ）。そのため、ここでは PR を作らない
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node.js のメジャーバージョンは手で上げる（npm の @types/node と同じ理由）
      - dependency-name: node
        update-types:
          - version-update:semver-major
